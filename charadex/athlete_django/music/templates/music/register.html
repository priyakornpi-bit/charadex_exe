{% extends "base.html" %}{% block title %}Register - CHARADEX{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="eyebrow">Join the archive</div><h1>Make your mark.</h1><p>Create an account to publish original characters and curate favorites.</p><form method="post">{% csrf_token %}<div class="field"><label for="username">Username</label><input id="username" name="username" required autofocus></div><div class="field"><label for="email">Email (optional)</label><input id="email" type="email" name="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" name="password" required minlength="6"></div><div class="field"><label for="password2">Confirm password</label><input id="password2" type="password" name="password2" required minlength="6"></div><button class="btn" type="submit">Create account</button></form><div class="auth-alt">Already registered? <a href="{% url 'login' %}">Log in</a></div></div></div>{% endblock %}
